name: Release

# This repository owns public artifacts. Source is checked out from the private
# repository at the requested tag using SOURCE_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: v-prefixed release tag (leave blank to increment the latest public patch version)
        required: false
        type: string
      ref:
        description: brain-private branch or commit to tag when the tag does not exist yet
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REPO: ahmed3mar/brain-private
  CARGO_TERM_COLOR: always

jobs:
  # Validates the tag and, if brain-private does not have it yet, tags `ref`
  # there first (SOURCE_TOKEN needs Contents: write on brain-private for that).
  tag:
    name: ensure source tag
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve and validate release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            tags="$(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name')"
            latest="$(printf '%s\n' "$tags" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
            if [[ -z "$latest" ]]; then
              echo "No stable public version tag found; provide an explicit release tag" >&2
              exit 1
            fi
            prefix="${latest%.*}"
            patch="${latest##*.}"
            RELEASE_TAG="$prefix.$((10#$patch + 1))"
            echo "Next release tag: $RELEASE_TAG (latest: $latest)"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag must look like v1.2.3" >&2
            exit 1
          }
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create the tag in brain-private if missing
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SOURCE_REF: ${{ inputs.ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$SOURCE_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists in $SOURCE_REPO"
            exit 0
          fi
          sha="$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_REF" --jq .sha)"
          gh api "repos/$SOURCE_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$sha" >/dev/null
          echo "Tagged $SOURCE_REPO@$SOURCE_REF ($sha) as $RELEASE_TAG"

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: tag
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled on Apple Silicon: the Intel runners are the slowest
          # and scarcest, and set the whole release's wall time.
          - runner: macos-15
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout private source at tag
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libglib2.0-dev libgtk-3-dev libssl-dev libvulkan-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev

      # The source stays at its placeholder version; the binaries report the
      # release tag (`brain --version`, About, the updater's comparison).
      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          sed -i.bak '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$version"'"/' Cargo.toml
          rm Cargo.toml.bak
          grep -A4 '^\[workspace.package\]' Cargo.toml | grep -qx "version = \"$version\""
          cargo update --workspace
          git diff --stat

      # Optional Developer ID signing. Without MACOS_CERTIFICATE_P12 the app is
      # ad-hoc signed: it runs, but a browser-downloaded copy is quarantined and
      # Gatekeeper reports it as "damaged" until `xattr -dr
      # com.apple.quarantine Brain.app`. The .p12 is a Developer ID Application
      # certificate with its private key, base64-encoded.
      - name: Import the Developer ID certificate
        id: signing
        if: matrix.platform == 'macos'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" ]]; then
            echo "::warning::MACOS_CERTIFICATE_P12 is not set; Brain.app is ad-hoc signed and not notarized"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [[ -n "$identity" ]] || { echo "the certificate holds no Developer ID Application identity" >&2; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # macOS: scripts/bundle-macos.sh (the source's own bundler) builds both
      # binaries and assembles Brain.app: the `brain` daemon beside the app,
      # icon, Info.plist and a signature that seals them.
      - name: Build release binaries
        shell: bash
        env:
          BRAIN_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            CARGO_BUILD_TARGET="${{ matrix.target }}" scripts/bundle-macos.sh
          else
            cargo build --locked --release --target "${{ matrix.target }}" \
              -p brain-cli -p brain-desktop \
              --bin brain --bin brain-desktop
          fi

      # Notarizing needs an App Store Connect API key (Developer role): the .p8
      # contents, its key id and its issuer id. The ticket is stapled into the
      # bundle, so Gatekeeper accepts it offline too.
      - name: Notarize Brain.app
        if: matrix.platform == 'macos' && steps.signing.outputs.identity != '-'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${API_KEY:-}" && -n "${API_KEY_ID:-}" && -n "${API_ISSUER_ID:-}" ]] || {
            echo "Developer ID signing is set up, so APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are required" >&2
            exit 1
          }
          app="target/${{ matrix.target }}/release/Brain.app"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$API_KEY" > "$key"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Brain.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/Brain.zip" \
            --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --output-format json)"
          echo "$result"
          if [[ "$(jq -r .status <<<"$result")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id <<<"$result")" \
              --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            exit 1
          fi
          rm "$key"
          xcrun stapler staple "$app"
          spctl --assess --type execute -vv "$app"

      - name: Package CLI and desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          target_dir="target/${{ matrix.target }}/release"
          cli_name="brain-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          desktop_name="brain-desktop-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

          mkdir -p "dist/${cli_name}" "dist/${desktop_name}"

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            # The signed (and possibly stapled) bundle, copied without changes:
            # any byte added after signing breaks its seal.
            cp "target/${{ matrix.target }}/release-cli/brain" "dist/${cli_name}/brain"
            ditto "$target_dir/Brain.app" "dist/${desktop_name}/Brain.app"
            codesign --verify --strict "dist/${desktop_name}/Brain.app"
          else
            cp "$target_dir/brain" "dist/${cli_name}/brain"
            cp "$target_dir/brain-desktop" "dist/${desktop_name}/brain-desktop"
            cat > "dist/${desktop_name}/brain.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Brain
          Comment=Collaborative coding workspace
          Exec=brain-desktop
          Terminal=false
          Categories=Development;
          DESKTOP
          fi

          # COPYFILE_DISABLE: no AppleDouble `._*` files, which break the seal.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/${cli_name}.tar.gz" "$cli_name"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/${desktop_name}.tar.gz" "$desktop_name"
          rm -rf "dist/${cli_name}" "dist/${desktop_name}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [tag, build]
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # Plan 46's update feed: `brain-<target>.tar.gz` with `brain` at the top,
      # and `latest.json` naming them with their sha256. Workers updated from
      # Brain Cloud, ssh remotes and the cloud's "latest version" read it.
      - name: Server archives and latest.json
        working-directory: dist
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          server='{}'
          for pair in macos-arm64:aarch64-apple-darwin macos-x64:x86_64-apple-darwin \
            linux-arm64:aarch64-unknown-linux-musl linux-x64:x86_64-unknown-linux-musl; do
            platform="${pair%%:*}" triple="${pair#*:}"
            src="brain-${version}-${platform}.tar.gz"
            [[ -f "$src" ]] || continue
            unpack="$(mktemp -d)"
            tar -xzf "$src" -C "$unpack"
            tar -C "$unpack/brain-${version}-${platform}" -czf "brain-${triple}.tar.gz" brain
            rm -rf "$unpack"
            sha="$(sha256sum "brain-${triple}.tar.gz" | awk '{print $1}')"
            server="$(jq -c --arg t "$triple" --arg url "${base}/brain-${triple}.tar.gz" --arg sha "$sha" \
              '. + {($t): {url: $url, sha256: $sha}}' <<<"$server")"
          done
          jq -n --arg v "$version" --argjson server "$server" '{version: $v, assets: {}, server: $server}' > latest.json
          cat latest.json

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh release view "$RELEASE_TAG" -R "$repo" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* -R "$repo" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* -R "$repo" \
              --title "$RELEASE_TAG" --generate-notes
          fi

  homebrew:
    name: update Homebrew tap
    needs: [tag, publish]
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Render and push formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping tap update" >&2
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" \
            -p checksums.txt -O checksums.txt --clobber
          sha() { grep "brain-${version}-$1.tar.gz" checksums.txt | awk '{print $1}'; }

          cat > brain.rb <<EOF
          class Brain < Formula
            desc "Collaborative coding workspace"
            homepage "https://github.com/ahmed3mar/brain"
            version "${version}"

            on_macos do
              on_arm do
                url "${base}/brain-${version}-macos-arm64.tar.gz"
                sha256 "$(sha macos-arm64)"
              end
              on_intel do
                url "${base}/brain-${version}-macos-x64.tar.gz"
                sha256 "$(sha macos-x64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/brain-${version}-linux-arm64.tar.gz"
                sha256 "$(sha linux-arm64)"
              end
              on_intel do
                url "${base}/brain-${version}-linux-x64.tar.gz"
                sha256 "$(sha linux-x64)"
              end
            end

            def install
              bin.install "brain"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/brain --version")
            end
          end
          EOF

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ahmed3mar/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv brain.rb tap/Formula/brain.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/brain.rb
          git commit -m "brain ${version}" || { echo "no formula change"; exit 0; }
          git push
