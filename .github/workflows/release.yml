name: Release

# This repository owns public artifacts. Source is checked out from the private
# repository at the requested tag using SOURCE_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: v-prefixed tag in brain-private to build and release
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REPO: ahmed3mar/brain-private
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag must look like v1.2.3" >&2
            exit 1
          }

      - name: Checkout private source at tag
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libvulkan-dev libwayland-dev libxkbcommon-x11-dev

      - name: Test release binaries
        shell: bash
        run: |
          cargo check --locked --release --target "${{ matrix.target }}" \
            -p brain-cli -p brain-desktop \
            --bin brain --bin brain-desktop

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" \
            -p brain-cli -p brain-desktop \
            --bin brain --bin brain-desktop

      - name: Package CLI and desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          target_dir="target/${{ matrix.target }}/release"
          cli_name="brain-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          desktop_name="brain-desktop-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

          mkdir -p "dist/${cli_name}" "dist/${desktop_name}"
          cp "$target_dir/brain" "dist/${cli_name}/brain"

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            app="dist/${desktop_name}/Brain.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$target_dir/brain-desktop" "$app/Contents/MacOS/brain-desktop"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Brain</string>
            <key>CFBundleExecutable</key><string>brain-desktop</string>
            <key>CFBundleIdentifier</key><string>dev.brain.desktop</string>
            <key>CFBundleName</key><string>Brain</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          else
            cp "$target_dir/brain-desktop" "dist/${desktop_name}/brain-desktop"
            cat > "dist/${desktop_name}/brain.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Brain
          Comment=Collaborative coding workspace
          Exec=brain-desktop
          Terminal=false
          Categories=Development;
          DESKTOP
          fi

          tar -C dist -czf "dist/${cli_name}.tar.gz" "$cli_name"
          tar -C dist -czf "dist/${desktop_name}.tar.gz" "$desktop_name"
          rm -rf "dist/${cli_name}" "dist/${desktop_name}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh release view "$RELEASE_TAG" -R "$repo" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* -R "$repo" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* -R "$repo" \
              --title "$RELEASE_TAG" --generate-notes
          fi

  homebrew:
    name: update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Render and push formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping tap update" >&2
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" \
            -p checksums.txt -O checksums.txt --clobber
          sha() { grep "brain-${version}-$1.tar.gz" checksums.txt | awk '{print $1}'; }

          cat > brain.rb <<EOF
          class Brain < Formula
            desc "Collaborative coding workspace"
            homepage "https://github.com/ahmed3mar/brain"
            version "${version}"

            on_macos do
              on_arm do
                url "${base}/brain-${version}-macos-arm64.tar.gz"
                sha256 "$(sha macos-arm64)"
              end
              on_intel do
                url "${base}/brain-${version}-macos-x64.tar.gz"
                sha256 "$(sha macos-x64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/brain-${version}-linux-arm64.tar.gz"
                sha256 "$(sha linux-arm64)"
              end
              on_intel do
                url "${base}/brain-${version}-linux-x64.tar.gz"
                sha256 "$(sha linux-x64)"
              end
            end

            def install
              bin.install "brain"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/brain --version")
            end
          end
          EOF

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ahmed3mar/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv brain.rb tap/Formula/brain.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/brain.rb
          git commit -m "brain ${version}" || { echo "no formula change"; exit 0; }
          git push
